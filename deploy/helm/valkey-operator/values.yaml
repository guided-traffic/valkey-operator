# Default values for valkey-operator.

replicaCount: 1

image:
  repository: guidedtraffic/valkey-operator
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created.
  create: true
  # Annotations to add to the service account.
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template.
  name: ""

podAnnotations: {}
podLabels: {}

resources:
  requests:
    cpu: 10m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

nodeSelector: {}
tolerations: []
affinity: {}

# Leader election ensures only one operator instance is active at a time.
leaderElection:
  enabled: true

# preUpgradeHook configures the Helm pre-upgrade hook Job that migrates existing
# Valkey CRs to the field defaults of the current operator version.
# The hook runs before the operator Deployment is updated, ensuring the CRD schema
# and CR defaults are in place before the new operator starts reconciling.
preUpgradeHook:
  # enabled controls whether the pre-upgrade Job and its RBAC resources are rendered.
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
