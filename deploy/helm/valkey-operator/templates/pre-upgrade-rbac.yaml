{{- if .Values.preUpgradeHook.enabled }}
---
# ServiceAccount used by the pre-upgrade hook Job.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "valkey-operator.fullname" . }}-upgrade
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "valkey-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: pre-upgrade-hook
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
---
# ClusterRole that grants the hook read+patch access to Valkey CRs and the CRD itself.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "valkey-operator.fullname" . }}-upgrade
  labels:
    {{- include "valkey-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: pre-upgrade-hook
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
rules:
  # Read and patch Valkey CRs across all namespaces
  - apiGroups:
      - vko.gtrfc.com
    resources:
      - valkeys
    verbs:
      - get
      - list
      - patch
      - update
  # Update the CRD to the latest schema before migrating existing CRs
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - get
      - list
      - patch
      - update
---
# ClusterRoleBinding that binds the hook ServiceAccount to the hook ClusterRole.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "valkey-operator.fullname" . }}-upgrade
  labels:
    {{- include "valkey-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: pre-upgrade-hook
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "valkey-operator.fullname" . }}-upgrade
subjects:
  - kind: ServiceAccount
    name: {{ include "valkey-operator.fullname" . }}-upgrade
    namespace: {{ .Release.Namespace }}
{{- end }}
