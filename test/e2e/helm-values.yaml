# Helm values for E2E testing
replicaCount: 1

image:
  repository: valkey-operator
  pullPolicy: Never
  tag: test

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 10m
    memory: 64Mi

leaderElection:
  enabled: false

# The Localhost seccomp profiles the e2e may name (ADR 0033 D9): the fixture
# TestE2E_PodHardening installs on every node, and the path its negative control
# names without installing it. Any other Localhost profile is refused.
valkeyPodSecurity:
  allowedSeccompLocalhostProfiles:
    - profiles/vko-e2e.json
    - profiles/vko-e2e-missing.json
